name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: HiGarfield/lede-17.01.4-Mod

jobs:
  repository_dispatch:
    if: github.repository == 'HiGarfield/lede-17.01.4-Mod' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: actions/checkout@main

      - name: Get dispatch event type
        id: title
        run: |
          commit_title=$(git log -1 --pretty=format:%s)
          # repository_dispatch 的 event_type 仅允许字母、数字与 . _ - 字符，
          # 其余（空格/换行/多字节/标点等）一律滤除为 '-'，并合并、去首尾、截断到 100 字符
          event_type=$(printf '%s' "$commit_title" | tr -c 'A-Za-z0-9._-' '-' | tr -s '-' | sed 's/^-//;s/-$//' | cut -c1-100)
          [ -n "$event_type" ] || event_type=lede-build
          echo "event_type=$event_type" >> $GITHUB_OUTPUT

      - uses: HiGarfield/repository-dispatch@main
        with:
          token: ${{ secrets.MY_TOKEN }}
          repository: ${{ secrets.SECOND_REPO }}
          event-type: ${{ steps.title.outputs.event_type }}

  generate_matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      lede_version: ${{ steps.set-matrix.outputs.lede_version }}
    steps:
      - uses: actions/checkout@main

      - id: set-matrix
        run: |
          command -v jq >/dev/null 2>&1 || sudo apt-get install -y -qq jq
          if [ -f version ]; then
            conf_dir=conf
            v=$(cat version)
          else
            git clone https://github.com/${SOURCE_REPO}.git source
            conf_dir=source/conf
            v=$(cat source/version)
          fi
          echo "lede_version=$v" >> $GITHUB_OUTPUT
          config_files=$(ls $conf_dir/.config.* 2>/dev/null)
          if [ -z "$config_files" ]; then
            echo "Error: no .config.* files found in $conf_dir" >&2
            exit 1
          fi
          device_targets=$(echo "$config_files" | sed 's|.*/\.config\.||' | sort)
          targets=$(echo "$device_targets" | jq -R . | jq -sc '["dl"] + .')
          echo "matrix=$targets" >> $GITHUB_OUTPUT

  build:
    needs: [generate_matrix]
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        target: ${{ fromJson(needs.generate_matrix.outputs.matrix) }}

    env:
      TARGET_DEVICE: ${{ matrix.target }}
      LEDE_VERSION: ${{ needs.generate_matrix.outputs.lede_version }}

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Prepare source
        run: |
          if [ -f version ]; then
            echo "WORKING_DIR=$PWD" >> $GITHUB_ENV
          else
            git clone https://github.com/${SOURCE_REPO}.git source
            echo "WORKING_DIR=$PWD/source" >> $GITHUB_ENV
          fi

      - name: Compute names
        run: |
          if [ "$TARGET_DEVICE" = "dl" ]; then
            name=dl-${LEDE_VERSION}
          else
            name=lede-${LEDE_VERSION}-${TARGET_DEVICE}
          fi
          echo "OUTPUT_NAME=$name" >> $GITHUB_ENV
          echo "OUTPUT_DIR=$WORKING_DIR/out" >> $GITHUB_ENV

      - name: Init build env
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          sudo swapoff -a
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /mnt/swapfile
          sudo apt-get update -qq -y
          sudo apt-get install -qq -y \
            build-essential gettext gawk subversion zlib1g-dev
          # Nothing needs Python 2 any more: the two Python scripts that run
          # on the host (wireless-regdb's db2fw.py and ca-certificates'
          # certdata2pem.py) produce identical output under Python 2 and 3,
          # scons is skipped when no Python 2 is found, and node uses the
          # python2 the tree builds itself.  make prereq still wants a
          # "python" command, so point it at python3 if the image has none -
          # building CPython 2.7 from source here cost minutes on every
          # matrix entry for no benefit.
          command -v python >/dev/null || \
            sudo ln -s "$(command -v python3)" /usr/local/bin/python
          python -V

          sudo apt-get autoremove -qq -y
          sudo apt-get clean -qq -y

          sed -i 's/HOST_BUILD_PARALLEL ?=/HOST_BUILD_PARALLEL ?= 1/g' include/host-build.mk
          sed -i 's/PKG_BUILD_PARALLEL ?=/PKG_BUILD_PARALLEL ?= 1/g' include/package.mk

          rm -f "package/firmware/wireless-regdb/patches/501-limit-tx-power.patch"

      - name: Toolchain cache key
        if: env.TARGET_DEVICE != 'dl'
        id: tc
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          arch=$(sed -n 's/^CONFIG_TARGET_BOARD="\(.*\)"/\1/p' conf/.config.$TARGET_DEVICE)
          gcc_hash=$(gcc --version | sha1sum | cut -c1-8)
          tl_hash=$(git log --pretty=tformat:"%h" -n1 tools toolchain | head -n1)
          base="$arch-${gcc_hash}-cache-openwrt-${tl_hash}"
          echo "restore=$base" >> $GITHUB_OUTPUT
          echo "key=$base-$(date +%s)" >> $GITHUB_OUTPUT

      - name: Restore toolchain cache
        if: env.TARGET_DEVICE != 'dl'
        id: toolchain
        uses: actions/cache/restore@main
        with:
          path: |
            ${{ env.WORKING_DIR }}/staging_dir/host*
            ${{ env.WORKING_DIR }}/staging_dir/tool*
            ${{ env.WORKING_DIR }}/.ccache
          key: ${{ steps.tc.outputs.key }}
          restore-keys: ${{ steps.tc.outputs.restore }}

      - name: Skip toolchain rebuild on cache hit
        if: env.TARGET_DEVICE != 'dl' && steps.toolchain.outputs.cache-matched-key != ''
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          sed -i 's/ $(tool.*\/stamp-compile)//;' Makefile
          sed -i 's/ $(tool.*\/stamp-install)//;' Makefile

      - uses: actions/cache/restore@main
        if: env.TARGET_DEVICE != 'dl'
        with:
          path: ${{ env.WORKING_DIR }}/dl
          key: ${{ github.repository_id }}-dl-${{ github.run_id }}
          restore-keys: ${{ github.repository_id }}-dl-

      - name: Build
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          if [ "$TARGET_DEVICE" != "dl" ]; then
            cp -f conf/.config.$TARGET_DEVICE .config
            make defconfig
            make -j$(nproc) || make -j1 V=s
            mkdir -p $OUTPUT_DIR
            for f in bin/targets/*/*/*-factory.bin \
                     bin/targets/*/*/*-sysupgrade.bin \
                     bin/targets/*/*/*-initramfs-kernel.bin; do
              [ -f "$f" ] || continue
              cp -u -f "$f" ${OUTPUT_DIR}/
            done
            echo "Collected images:"
            ls -1 ${OUTPUT_DIR}/
          else
            ./download_all.sh
            mkdir -p $OUTPUT_DIR
            zip -j ${OUTPUT_DIR}/${OUTPUT_NAME}.zip dl/*
          fi

      - uses: actions/upload-artifact@main
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: ${{ env.OUTPUT_DIR }}/*

      - uses: actions/cache/save@main
        if: env.TARGET_DEVICE == 'dl'
        with:
          path: ${{ env.WORKING_DIR }}/dl
          key: ${{ github.repository_id }}-dl-${{ github.run_id }}

      - name: Save toolchain cache
        if: env.TARGET_DEVICE != 'dl' && steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@main
        with:
          path: |
            ${{ env.WORKING_DIR }}/staging_dir/host*
            ${{ env.WORKING_DIR }}/staging_dir/tool*
            ${{ env.WORKING_DIR }}/.ccache
          key: ${{ steps.tc.outputs.key }}

  create_release:
    needs: [generate_matrix, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@main
        with:
          path: artifacts
          merge-multiple: true

      - uses: HiGarfield/action-gh-release@master
        with:
          tag_name: ${{ needs.generate_matrix.outputs.lede_version }}
          files: artifacts/*
          make_latest: true
          overwrite_files: true

  cleanup:
    needs: create_release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: HiGarfield/delete-release-action@master
        continue-on-error: true
        with:
          release-drop: true
          release-keep-count: 0
          release-drop-tag: true
          pre-release-drop: true
          pre-release-keep-count: -1
          pre-release-drop-tag: true
          draft-drop: true
          draft-drop-count: -1
        env:
          GITHUB_TOKEN: ${{ github.token }}
