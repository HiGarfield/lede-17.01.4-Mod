name: fetch cache

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */3 * *"

permissions:
  contents: read

env:
  SOURCE_REPO: HiGarfield/lede-17.01.4-Mod

jobs:
  generate_archs:
    runs-on: ubuntu-26.04
    outputs:
      archs: ${{ steps.set-archs.outputs.archs }}
    steps:
      - uses: actions/checkout@main

      - name: Enumerate target architectures
        id: set-archs
        run: |
          command -v jq >/dev/null 2>&1 || sudo apt-get install -y -qq jq
          if [ -f version ]; then
            conf_dir=conf
          else
            git clone https://github.com/${SOURCE_REPO}.git source
            conf_dir=source/conf
          fi
          archs=$(
            for f in "$conf_dir"/.config.*; do
              [ -f "$f" ] || continue
              sed -n 's/^CONFIG_TARGET_BOARD="\(.*\)"/\1/p' "$f"
            done | sort -u
          )
          if [ -z "$archs" ]; then
            echo "Error: no CONFIG_TARGET_BOARD architectures found in $conf_dir/.config.*" >&2
            exit 1
          fi
          archs_json=$(printf '%s\n' "$archs" | jq -R . | jq -sc .)
          echo "archs=$archs_json" >> $GITHUB_OUTPUT

  fetch_cache:
    needs: generate_archs
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.generate_archs.outputs.archs) }}

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Prepare source
        run: |
          if [ -f version ]; then
            echo "WORKING_DIR=$PWD" >> $GITHUB_ENV
          else
            git clone https://github.com/${SOURCE_REPO}.git source
            echo "WORKING_DIR=$PWD/source" >> $GITHUB_ENV
          fi

      - name: Install minimal build deps
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          sudo apt-get update -qq -y
          sudo apt-get install -qq -y build-essential

      - name: Generate cache mixkey
        id: mixkey
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          gcc_hash=$(gcc --version | sha1sum | cut -c1-8)
          tl_hash=$(git log --pretty=tformat:"%h" -n1 tools toolchain | head -n1)
          base="${{ matrix.arch }}-${gcc_hash}-cache-openwrt-${tl_hash}"
          echo "restore=$base" >> $GITHUB_OUTPUT
          echo "key=$base-$(date +%s)" >> $GITHUB_OUTPUT

      - name: Restore toolchain cache
        id: toolchain
        uses: actions/cache/restore@main
        with:
          path: |
            ${{ env.WORKING_DIR }}/staging_dir/host*
            ${{ env.WORKING_DIR }}/staging_dir/tool*
            ${{ env.WORKING_DIR }}/.ccache
          key: ${{ steps.mixkey.outputs.key }}
          restore-keys: ${{ steps.mixkey.outputs.restore }}

      - name: Skip toolchain rebuild on cache hit
        if: steps.toolchain.outputs.cache-matched-key != ''
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          sed -i 's/ $(tool.*\/stamp-compile)//;' Makefile
          sed -i 's/ $(tool.*\/stamp-install)//;' Makefile

      - name: Restore dl cache
        uses: actions/cache/restore@main
        with:
          path: ${{ env.WORKING_DIR }}/dl
          key: ${{ github.repository_id }}-dl-${{ github.run_id }}
          restore-keys: ${{ github.repository_id }}-dl-
